name: Release
on:
  workflow_dispatch:
  release:

jobs:
  check:
    uses: ./.github/workflows/check.yml
    secrets: inherit

  publish_npm:
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - name: Checkout git files
        uses: actions/checkout@v2

      - name: Setup rokit
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          token: ${{ github.token }}

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Sync version
        run: lute run scripts/bump_version

      - name: Publish npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish_wally:
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - name: Checkout git files
        uses: actions/checkout@v2

      - name: Setup rokit
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          token: ${{ github.token }}

      - run: wally login --token "$WALLY_TOKEN"
        env:
          WALLY_TOKEN: ${{ secrets.WALLY_TOKEN }}
          GH_TOKEN: ${{ github.token }}

      - name: Sync version
        run: lute run scripts/bump_version

      - name: Publish wally
        run: wally publish

  publish_pesde:
    runs-on: ubuntu-latest
    needs: [check]
    permissions:
      pull-requests: write
      contents: write
      issues: write
    steps:
      - name: Checkout git files
        uses: actions/checkout@v2

      - name: Setup pesde
        uses: axiom-co/setup-pesde@b690699ace34169731b6b2a1c93b2008472038a7
        with:
          token: ${{ github.token }}

      - run: pesde auth login --token "$PESDE_AUTH"
        env:
          PESDE_AUTH: ${{ secrets.PESDE_AUTH }}

      - name: Sync version
        run: lute run scripts/bump_version

      - name: Publish pesde
        run: pesde publish -y

  release_file:
    runs-on: ubuntu-latest
    needs: [check]
    permissions:
      contents: write
    steps:
      - name: Checkout git files
        uses: actions/checkout@v2

      - name: Setup rokit
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          token: ${{ github.token }}

      - name: Build rbxm
        run: rojo build default.project.json -o rng.rbxm

      - name: Upload rbxm
        if: ${{github.event.release.tag_name}}
        run: gh release upload ${{github.event.release.tag_name}} rng.rbxm
        env:
          GH_TOKEN: ${{ github.token }}
